<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}" />
  <link rel="icon" href="https://mergedcloud.de/favicon.ico" sizes="any" />
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | absolute_url }}" />
  <!-- IndieWeb: who wrote this, and where to send webmentions/pingbacks -->
  <link rel="author" href="{{ site.identity }}" />
  <!-- rel=me to GitHub (whose profile links back here) lets this subdomain sign in
       via IndieAuth on its own - needed for the IndieWeb Webring membership of
       blog.mergedcloud.de, separate from mergedcloud.de. -->
  <link rel="me" href="https://github.com/mergedeyes" />
  <link rel="webmention" href="https://webmention.io/{{ site.webmention_domain }}/webmention" />
  <link rel="pingback" href="https://webmention.io/{{ site.webmention_domain }}/xmlrpc" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="{{ '/' | relative_url }}">~/log</a>
      <nav class="top__nav" aria-label="Site">
        <a href="{{ '/now/' | relative_url }}">now</a>
        <a href="{{ site.identity }}">mergedcloud.de</a>
        <a href="{{ '/feed.xml' | relative_url }}">feed</a>
      </nav>
    </header>

    <main id="main">
{{ content }}
    </main>

    <footer class="foot">
      <!-- h-card: same identity as on mergedcloud.de -->
      <p class="h-card">
        Written by <a class="p-name u-url" rel="author" href="{{ site.identity }}">{{ site.author.name }}</a>.
        Replies welcome via <a href="https://indieweb.org/Webmention">webmention</a>.
      </p>
      <!-- IndieWeb Webring (xn--sr8hvo.ws = 🕸💍.ws). The blog is its own member
           (signed in as blog.mergedcloud.de via the rel=me above). The ring
           periodically checks this page for links pointing straight at 🕸💍.ws and
           marks the site inactive without them, so don't route these elsewhere. -->
      <p class="webring">
        <a href="https://xn--sr8hvo.ws/previous" aria-label="Previous site in the IndieWeb Webring">←</a>
        An <a href="https://xn--sr8hvo.ws">IndieWeb Webring</a> 🕸💍
        <a href="https://xn--sr8hvo.ws/next" aria-label="Next site in the IndieWeb Webring">→</a>
      </p>
    </footer>
  </div>
</body>
</html>
